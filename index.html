<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡GET OUT!</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #111;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #FF6B6B;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .required-field label::after {
            content: " *";
            color: #FF6B6B;
        }
        .optional-label {
            color: #888;
            font-size: 0.85rem;
            font-weight: normal;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #FF6B6B;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .submit-btn:hover {
            background: #ff5252;
        }
        #statusMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        #statusMessage.success {
            background: #22c55e;
            color: #fff;
        }
        #statusMessage.error {
            background: #ef4444;
            color: #fff;
        }
        .events-display {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .events-heading {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #FF6B6B;
        }
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .event-item {
            display: block;
            padding: 1.2rem 1rem;
            border-bottom: 1px solid #333;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease;
        }
        .event-item:hover {
            background: #1a1a1a;
        }
        .event-item:nth-child(5n+1) { border-left: 5px solid #FF6B6B; }
        .event-item:nth-child(5n+2) { border-left: 5px solid #4ECDC4; }
        .event-item:nth-child(5n+3) { border-left: 5px solid #FFE66D; }
        .event-item:nth-child(5n+4) { border-left: 5px solid #95E1D3; }
        .event-item:nth-child(5n+5) { border-left: 5px solid #F38181; }
        .event-date-block {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .event-day {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }
        .event-month-year {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #aaa;
        }
        .event-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 1rem;
            color: #aaa;
        }
        .event-description {
            margin-top: 0.5rem;
            font-size: 1rem;
            color: #aaa;
            line-height: 1.4;
        }
        .event-link-btn {
            display: inline-block;
            margin-top: 0.6rem;
            padding: 0.4rem 0.8rem;
            background: #FF6B6B;
            color: #000;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .loading-message {
            text-align: center;
            padding: 3rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1>¡GET OUT!</h1>
    </header>
    
    <div class="form-container">
        <form id="eventForm">
            <div class="form-group required-field">
                <label for="eventName">Nom de l'événement</label>
                <input type="text" id="eventName" name="eventName" placeholder="Ex: Concert Jazz" required>
            </div>
            
            <div class="form-group required-field">
                <label for="eventDate">Date</label>
                <input type="date" id="eventDate" name="eventDate" required>
            </div>
            
            <div class="form-group">
                <label for="eventTime">Heure <span class="optional-label">(optionnel)</span></label>
                <input type="time" id="eventTime" name="eventTime" placeholder="Ex: 20:00">
            </div>
            
            <div class="form-group">
                <label for="eventLieu">Lieu <span class="optional-label">(optionnel)</span></label>
                <input type="text" id="eventLieu" name="eventLieu" placeholder="Ex: Point Éphémère, Paris">
            </div>
            
            <div class="form-group">
                <label for="eventLink">Lien <span class="optional-label">(optionnel)</span></label>
                <input type="url" id="eventLink" name="eventLink" placeholder="Ex: https://www.billeterie.com/concert">
            </div>
            
            <div class="form-group">
                <label for="eventDescription">Description <span class="optional-label">(optionnel)</span></label>
                <textarea id="eventDescription" name="eventDescription" placeholder="Décrivez votre événement..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Ajouter l'événement</button>
            <div id="statusMessage"></div>
        </form>
    </div>

    <!-- Events Display Section -->
    <div class="events-display">
        <h2 class="events-heading">Événements à venir</h2>
        <div class="events-list" id="eventsList">
            <div class="loading-message">Chargement des événements...</div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script src="js/display.js"></script>
</body>
</html>
