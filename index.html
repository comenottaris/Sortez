<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sortez — Calendrier</title>

  <!-- Cal-Heatmap v3 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/cal-heatmap/3.3.10/cal-heatmap.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="topbar">
  <h1>Sortez</h1>
</header>

<main class="container">
  <div id="cal-heatmap"></div>
  <p class="hint">Touchez une date pour ajouter un événement</p>

  <section id="eventsList"></section>
</main>

<button id="fab" class="fab">＋</button>

<!-- Bottom sheet -->
<div id="sheet" class="sheet hidden">
  <form id="eventForm">
    <header>
      <h2>Nouvel événement</h2>
      <button type="button" id="closeSheet">✕</button>
    </header>

    <label>Date
      <input type="date" id="evtDate" required>
    </label>

    <label>Titre
      <input type="text" id="evtTitle" placeholder="Concert, expo…">
    </label>

    <label>Quantité
      <input type="number" id="evtCount" value="1" min="1">
    </label>

    <label>Lien
      <input type="url" id="evtLink" placeholder="https://">
    </label>

    <label>Image (URL)
      <input type="url" id="evtImage" placeholder="https://...jpg">
    </label>

    <details>
      <summary>Admin GitHub (une seule fois)</summary>
      <input type="password" id="ghToken" placeholder="GitHub Action token">
      <button type="button" id="saveToken">Enregistrer le token</button>
      <small>Token stocké localement sur cet appareil</small>
    </details>

    <button type="submit" class="btn primary">Ajouter</button>
  </form>
</div>

<script src="//d3js.org/d3.v3.min.js"></script>
<script src="//cdn.jsdelivr.net/cal-heatmap/3.3.10/cal-heatmap.min.js"></script>

<script>
/* ---- CONFIG ---- */
const OWNER = "comenottaris";
const REPO = "Sortez";
const WORKFLOW = "add-event.yml";
const BRANCH = "main";

/* ---- UI ---- */
const fab = document.getElementById("fab");
const sheet = document.getElementById("sheet");
const closeSheet = document.getElementById("closeSheet");

fab.onclick = () => sheet.classList.remove("hidden");
closeSheet.onclick = () => sheet.classList.add("hidden");

document.getElementById("saveToken").onclick = () => {
  const t = document.getElementById("ghToken").value;
  localStorage.setItem("gh_action_token", t);
  alert("Token enregistré sur cet appareil");
};

/* ---- SUBMIT ---- */
document.getElementById("eventForm").onsubmit = async (e) => {
  e.preventDefault();

  const eventData = {
    date: evtDate.value,
    title: evtTitle.value,
    count: Number(evtCount.value || 1),
    link: evtLink.value,
    image: evtImage.value
  };

  await sendToGitHub(eventData);
  alert("Événement envoyé");
  sheet.classList.add("hidden");
};

/* ---- BACKEND CALL ---- */
async function sendToGitHub(data) {
  const token = localStorage.getItem("gh_action_token");
  if (!token) {
    alert("Token GitHub manquant");
    return;
  }

  await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
    {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ref: BRANCH,
        inputs: {
          payload: JSON.stringify(data)
        }
      })
    }
  );
}
</script>

</body>
</html>
