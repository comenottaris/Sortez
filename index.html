<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORTEZ - Admin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-1: #FF6B6B;
            --color-2: #4ECDC4;
            --color-3: #FFE66D;
            --color-4: #95E1D3;
            --color-5: #F38181;
            --bg: #000000;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --border: #333333;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .header {
            background: var(--bg);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 3px solid var(--color-1);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .section {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--color-2);
            padding-bottom: 0.5rem;
        }

        .token-section {
            background: rgba(255, 193, 7, 0.1);
            border: 2px solid var(--warning);
        }

        .token-section.configured {
            background: rgba(40, 167, 69, 0.1);
            border-color: var(--success);
        }

        .token-status {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.875rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            border-radius: 4px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--color-1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--color-1);
            color: #000;
        }

        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--color-1);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .alert {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 4px;
            background: var(--bg-card);
            border-left: 4px solid;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-success { border-color: var(--success); color: var(--success); }
        .alert-error { border-color: var(--danger); color: var(--danger); }
        .alert-warning { border-color: var(--warning); color: var(--warning); }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-card {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 4px;
            border-left: 4px solid var(--color-1);
        }

        .event-card:nth-child(5n+1) { border-left-color: var(--color-1); }
        .event-card:nth-child(5n+2) { border-left-color: var(--color-2); }
        .event-card:nth-child(5n+3) { border-left-color: var(--color-3); }
        .event-card:nth-child(5n+4) { border-left-color: var(--color-4); }
        .event-card:nth-child(5n+5) { border-left-color: var(--color-5); }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .event-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .event-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .event-actions {
            display: flex;
            gap: 0.5rem;
        }

        .event-details {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .event-details p {
            margin-bottom: 0.5rem;
        }

        .edit-form {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .edit-form.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .help-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .help-text a {
            color: var(--color-2);
            text-decoration: none;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .event-header {
                flex-direction: column;
            }

            .event-actions {
                margin-top: 1rem;
            }

            .alert {
                left: 1rem;
                right: 1rem;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>SORTEZ - Administration</h1>
    </header>

    <div class="container">
        <!-- Token Configuration -->
        <section class="section token-section" id="tokenSection">
            <h2>🔐 Configuration</h2>
            <div class="token-status" id="tokenStatus">⚠️ Token non configuré</div>
            
            <div class="form-group">
                <label for="githubToken">GitHub Personal Access Token</label>
                <input type="password" id="githubToken" placeholder="ghp_... ou github_pat_...">
                <p class="help-text">
                    Créez un token sur <a href="https://github.com/settings/tokens" target="_blank">GitHub Settings</a> 
                    avec les permissions "Contents" (read & write).
                </p>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveToken()">💾 Enregistrer le token</button>
                <button class="btn btn-secondary" onclick="testToken()">🧪 Tester la connexion</button>
                <button class="btn btn-secondary" onclick="clearToken()">🗑️ Effacer le token</button>
            </div>
        </section>

        <!-- Add Event Form -->
        <section class="section">
            <h2>➕ Ajouter un événement</h2>
            <form id="eventForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="eventDate">Date *</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Heure</label>
                        <input type="time" id="eventTime">
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventName">Nom de l'événement *</label>
                    <input type="text" id="eventName" placeholder="Concert, exposition, festival..." required>
                </div>

                <div class="form-group">
                    <label for="eventType">Type</label>
                    <select id="eventType">
                        <option value="">-- Sélectionnez --</option>
                        <option value="Concert">Concert</option>
                        <option value="Exposition">Exposition</option>
                        <option value="Festival">Festival</option>
                        <option value="Spectacle">Spectacle</option>
                        <option value="Club">Club / Soirée</option>
                        <option value="Rencontre">Rencontre / Talk</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="eventLieu">Lieu</label>
                    <input type="text" id="eventLieu" placeholder="Point Éphémère, La Bellevilloise...">
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Détails de l'événement..."></textarea>
                </div>

                <div class="form-group">
                    <label for="eventLink">Lien</label>
                    <input type="url" id="eventLink" placeholder="https://example.com/event">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">
                    ✨ Ajouter l'événement
                </button>
            </form>
        </section>

        <!-- Events List -->
        <section class="section">
            <h2>📋 Événements</h2>
            <div id="eventsList" class="event-list">
                <div class="loading">Chargement des événements...</div>
            </div>
        </section>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <script>
        const REPO_OWNER = 'comenottaris';
        const REPO_NAME = 'Sortez';
        const TOKEN_KEY = 'sortez_github_token';
        const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

        let allEvents = [];

        // ========================================
        // TOKEN MANAGEMENT
        // ========================================

        function checkTokenStatus() {
            const token = localStorage.getItem(TOKEN_KEY);
            const section = document.getElementById('tokenSection');
            const status = document.getElementById('tokenStatus');
            
            if (token && token.trim()) {
                section.classList.add('configured');
                status.textContent = '✅ Token configuré';
            } else {
                section.classList.remove('configured');
                status.textContent = '⚠️ Token non configuré';
            }
        }

        function saveToken() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                showAlert('Veuillez entrer un token', 'error');
                return;
            }
            
            if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
                showAlert('Le token doit commencer par "ghp_" ou "github_pat_"', 'error');
                return;
            }
            
            localStorage.setItem(TOKEN_KEY, token);
            checkTokenStatus();
            showAlert('Token enregistré! 🎉', 'success');
            document.getElementById('githubToken').value = '';
        }

        async function testToken() {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                showAlert('Aucun token configuré', 'error');
                return;
            }

            try {
                showAlert('Test en cours...', 'warning');
                
                const repoResponse = await fetch(API_BASE, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!repoResponse.ok) {
                    throw new Error(`Accès au repo refusé (${repoResponse.status})`);
                }

                const fileResponse = await fetch(`${API_BASE}/contents/data/events.json`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!fileResponse.ok) {
                    throw new Error(`Accès à events.json refusé (${fileResponse.status})`);
                }

                showAlert('✅ Connexion réussie! Token valide.', 'success');
            } catch (error) {
                console.error('Test failed:', error);
                showAlert('❌ Échec: ' + error.message, 'error');
            }
        }

        function clearToken() {
            if (confirm('Êtes-vous sûr de vouloir effacer le token?')) {
                localStorage.removeItem(TOKEN_KEY);
                checkTokenStatus();
                showAlert('Token effacé', 'success');
            }
        }

        // ========================================
        // ALERTS
        // ========================================

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.style.opacity = '0';
                alert.style.transform = 'translateX(400px)';
                setTimeout(() => alert.remove(), 300);
            }, 5000);
        }

        // ========================================
        // LOAD EVENTS
        // ========================================

        async function loadEvents() {
            try {
                const response = await fetch('https://comenottaris.github.io/Sortez/data/events.json', {
                    cache: 'no-store'
                });
                
                if (!response.ok) throw new Error('Erreur chargement');
                
                allEvents = await response.json();
                allEvents.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                renderEventsList();
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('eventsList').innerHTML = 
                    '<div class="loading">Erreur de chargement</div>';
            }
        }

        function renderEventsList() {
            const container = document.getElementById('eventsList');
            
            if (!allEvents || allEvents.length === 0) {
                container.innerHTML = '<div class="loading">Aucun événement</div>';
                return;
            }

            container.innerHTML = allEvents.map((event, index) => {
                const date = new Date(event.date);
                const formattedDate = date.toLocaleDateString('fr-FR', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                return `
                    <div class="event-card" data-index="${index}" data-event-id="${event.date}-${event.name}">
                        <div class="event-header">
                            <div>
                                <div class="event-title">${escapeHtml(event.name || event.title)}</div>
                                <div class="event-date">${formattedDate}${event.time ? ' - ' + event.time : ''}</div>
                            </div>
                            <div class="event-actions">
                                <button class="btn btn-secondary btn-small" onclick="editEvent(${index})">✏️ Modifier</button>
                                <button class="btn btn-danger btn-small" onclick="deleteEvent(${index}, '${escapeHtml(event.name || event.title)}')">🗑️ Supprimer</button>
                            </div>
                        </div>
                        
                        <div class="event-details">
                            ${event.type ? `<p><strong>Type:</strong> ${escapeHtml(event.type)}</p>` : ''}
                            ${event.lieu ? `<p><strong>Lieu:</strong> ${escapeHtml(event.lieu)}</p>` : ''}
                            ${event.description ? `<p><strong>Description:</strong> ${escapeHtml(event.description)}</p>` : ''}
                            ${event.link ? `<p><strong>Lien:</strong> <a href="${escapeHtml(event.link)}" target="_blank">${escapeHtml(event.link)}</a></p>` : ''}
                        </div>

                        <div class="edit-form" id="editForm${index}">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Date *</label>
                                    <input type="date" id="editDate${index}" value="${event.date}" required>
                                </div>
                                <div class="form-group">
                                    <label>Heure</label>
                                    <input type="time" id="editTime${index}" value="${event.time || ''}">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>Nom *</label>
                                <input type="text" id="editName${index}" value="${escapeHtml(event.name || event.title)}" required>
                            </div>
                            
                            <div class="form-group">
                                <label>Type</label>
                                <select id="editType${index}">
                                    <option value="">-- Sélectionnez --</option>
                                    <option value="Concert" ${event.type === 'Concert' ? 'selected' : ''}>Concert</option>
                                    <option value="Exposition" ${event.type === 'Exposition' ? 'selected' : ''}>Exposition</option>
                                    <option value="Festival" ${event.type === 'Festival' ? 'selected' : ''}>Festival</option>
                                    <option value="Spectacle" ${event.type === 'Spectacle' ? 'selected' : ''}>Spectacle</option>
                                    <option value="Club" ${event.type === 'Club' ? 'selected' : ''}>Club / Soirée</option>
                                    <option value="Rencontre" ${event.type === 'Rencontre' ? 'selected' : ''}>Rencontre / Talk</option>
                                    <option value="Autre" ${event.type === 'Autre' ? 'selected' : ''}>Autre</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>Lieu</label>
                                <input type="text" id="editLieu${index}" value="${escapeHtml(event.lieu || '')}">
                            </div>
                            
                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="editDescription${index}">${escapeHtml(event.description || '')}</textarea>
                            </div>
                            
                            <div class="form-group">
                                <label>Lien</label>
                                <input type="url" id="editLink${index}" value="${escapeHtml(event.link || '')}">
                            </div>
                            
                            <div class="button-group">
                                <button class="btn btn-success" onclick="saveEdit(${index})">💾 Enregistrer</button>
                                <button class="btn btn-secondary" onclick="cancelEdit(${index})">❌ Annuler</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========================================
        // CRUD OPERATIONS - SÉCURISÉES
        // ========================================

        async function addEvent(eventData) {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                showAlert('Token non configuré', 'error');
                return false;
            }

            try {
                // Récupérer le fichier actuel
                const fileResponse = await fetch(`${API_BASE}/contents/data/events.json`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!fileResponse.ok) {
                    throw new Error(`Échec récupération fichier (${fileResponse.status})`);
                }
                
                const fileData = await fileResponse.json();
                let currentContent;
                
                try {
                    currentContent = JSON.parse(atob(fileData.content));
                } catch (parseError) {
                    throw new Error('Erreur parsing JSON - fichier corrompu');
                }
                
                // Vérifier que c'est bien un tableau
                if (!Array.isArray(currentContent)) {
                    throw new Error('Le fichier events.json ne contient pas un tableau valide');
                }
                
                // Sauvegarder l'état actuel avant modification
                const backupContent = JSON.stringify(currentContent);
                console.log('📦 Backup créé:', currentContent.length, 'événements');
                
                // Ajouter le nouvel événement
                currentContent.push(eventData);
                console.log('➕ Ajout événement. Total:', currentContent.length);
                
                // Commit avec message clair
                const updateResponse = await fetch(`${API_BASE}/contents/data/events.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add event: ${eventData.name} (${eventData.date})`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2)))),
                        sha: fileData.sha
                    })
                });

                if (!updateResponse.ok) {
                    const error = await updateResponse.text();
                    throw new Error(`Erreur commit ${updateResponse.status}: ${error}`);
                }

                showAlert('✅ Événement ajouté! Rafraîchissement dans 3s...', 'success');
                setTimeout(loadEvents, 3000);
                return true;
            } catch (error) {
                console.error('❌ Erreur addEvent:', error);
                showAlert('❌ Erreur: ' + error.message, 'error');
                return false;
            }
        }

        async function updateEvent(index, eventData) {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                showAlert('Token non configuré', 'error');
                return false;
            }

            try {
                // Vérifier que l'index est valide
                if (index < 0 || index >= allEvents.length) {
                    throw new Error(`Index invalide: ${index} (total: ${allEvents.length})`);
                }
                
                const fileResponse = await fetch(`${API_BASE}/contents/data/events.json`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!fileResponse.ok) {
                    throw new Error(`Échec récupération fichier (${fileResponse.status})`);
                }
                
                const fileData = await fileResponse.json();
                let currentContent;
                
                try {
                    currentContent = JSON.parse(atob(fileData.content));
                } catch (parseError) {
                    throw new Error('Erreur parsing JSON');
                }
                
                if (!Array.isArray(currentContent)) {
                    throw new Error('Format fichier invalide');
                }
                
                // Vérifier que l'événement existe toujours
                if (index >= currentContent.length) {
                    throw new Error(`L'événement n'existe plus (index ${index} > ${currentContent.length})`);
                }
                
                console.log('📝 Modification événement index', index, ':', currentContent[index].name, '→', eventData.name);
                
                // Remplacer UNIQUEMENT l'événement à l'index spécifié
                currentContent[index] = eventData;
                
                const updateResponse = await fetch(`${API_BASE}/contents/data/events.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update event: ${eventData.name} (${eventData.date})`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2)))),
                        sha: fileData.sha
                    })
                });

                if (!updateResponse.ok) {
                    throw new Error(`Échec mise à jour (${updateResponse.status})`);
                }

                showAlert('✅ Événement modifié! Rafraîchissement...', 'success');
                setTimeout(loadEvents, 2000);
                return true;
            } catch (error) {
                console.error('❌ Erreur updateEvent:', error);
                showAlert('❌ Erreur: ' + error.message, 'error');
                return false;
            }
        }

        async function deleteEvent(index, eventName) {
            // Double confirmation pour éviter suppressions accidentelles
            const confirmMessage = `⚠️ ATTENTION ⚠️\n\nVoulez-vous vraiment supprimer l'événement :\n\n"${eventName}"\n\nCette action est IRRÉVERSIBLE.`;
            
            if (!confirm(confirmMessage)) {
                console.log('🚫 Suppression annulée par l\'utilisateur');
                return;
            }

            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) {
                showAlert('Token non configuré', 'error');
                return;
            }

            try {
                // Vérifier que l'index est valide
                if (index < 0 || index >= allEvents.length) {
                    throw new Error(`Index invalide: ${index} (total: ${allEvents.length})`);
                }
                
                const fileResponse = await fetch(`${API_BASE}/contents/data/events.json`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!fileResponse.ok) {
                    throw new Error(`Échec récupération fichier (${fileResponse.status})`);
                }
                
                const fileData = await fileResponse.json();
                let currentContent;
                
                try {
                    currentContent = JSON.parse(atob(fileData.content));
                } catch (parseError) {
                    throw new Error('Erreur parsing JSON');
                }
                
                if (!Array.isArray(currentContent)) {
                    throw new Error('Format fichier invalide');
                }
                
                // Vérifier que l'événement existe toujours
                if (index >= currentContent.length) {
                    throw new Error(`L'événement n'existe plus (index ${index} > ${currentContent.length})`);
                }
                
                // Récupérer les infos de l'événement à supprimer
                const eventToDelete = currentContent[index];
                console.log('🗑️ Suppression événement index', index, ':', eventToDelete.name);
                console.log('📊 Avant suppression:', currentContent.length, 'événements');
                
                // Supprimer UNIQUEMENT l'événement à l'index spécifié
                currentContent.splice(index, 1);
                
                console.log('📊 Après suppression:', currentContent.length, 'événements');
                
                const updateResponse = await fetch(`${API_BASE}/contents/data/events.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete event: ${eventToDelete.name} (${eventToDelete.date})`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2)))),
                        sha: fileData.sha
                    })
                });

                if (!updateResponse.ok) {
                    throw new Error(`Échec suppression (${updateResponse.status})`);
                }

                showAlert('✅ Événement supprimé! Rafraîchissement...', 'success');
                setTimeout(loadEvents, 2000);
            } catch (error) {
                console.error('❌ Erreur deleteEvent:', error);
                showAlert('❌ Erreur: ' + error.message, 'error');
            }
        }

        function editEvent(index) {
            // Fermer tous les formulaires d'édition
            document.querySelectorAll('.edit-form').forEach(form => {
                form.classList.remove('active');
            });
            
            // Ouvrir le formulaire demandé
            const editForm = document.getElementById(`editForm${index}`);
            if (editForm) {
                editForm.classList.add('active');
                console.log('✏️ Mode édition activé pour index', index);
            }
        }

        function cancelEdit(index) {
            const editForm = document.getElementById(`editForm${index}`);
            if (editForm) {
                editForm.classList.remove('active');
                console.log('❌ Édition annulée pour index', index);
            }
        }

        async function saveEdit(index) {
            const eventData = {
                date: document.getElementById(`editDate${index}`).value,
                name: document.getElementById(`editName${index}`).value.trim(),
                time: document.getElementById(`editTime${index}`).value,
                type: document.getElementById(`editType${index}`).value,
                lieu: document.getElementById(`editLieu${index}`).value.trim(),
                description: document.getElementById(`editDescription${index}`).value.trim(),
                link: document.getElementById(`editLink${index}`).value.trim(),
                count: allEvents[index].count || 1,
                created_at: allEvents[index].created_at || new Date().toISOString()
            };

            if (!eventData.date || !eventData.name) {
                showAlert('Date et nom sont obligatoires', 'error');
                return;
            }

            console.log('💾 Sauvegarde modifications pour index', index);
            await updateEvent(index, eventData);
        }

        // ========================================
        // FORM HANDLING
        // ========================================

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Ajout en cours...';
            
            const eventData = {
                date: document.getElementById('eventDate').value,
                name: document.getElementById('eventName').value.trim(),
                time: document.getElementById('eventTime').value,
                type: document.getElementById('eventType').value,
                lieu: document.getElementById('eventLieu').value.trim(),
                description: document.getElementById('eventDescription').value.trim(),
                link: document.getElementById('eventLink').value.trim(),
                count: 1,
                created_at: new Date().toISOString()
            };
            
            console.log('📝 Création nouvel événement:', eventData.name);
            const success = await addEvent(eventData);
            
            if (success) {
                document.getElementById('eventForm').reset();
                document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
            }
            
            btn.disabled = false;
            btn.textContent = '✨ Ajouter l\'événement';
        });

        // ========================================
        // INITIALIZATION
        // ========================================

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Admin panel chargé');
            document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
            checkTokenStatus();
            loadEvents();
            setInterval(loadEvents, 60000);
        });
    </script>
</body>
</html>
