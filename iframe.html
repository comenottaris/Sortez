<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>¡GET OUT!</title>
    
    <style>
        *, :after, :before {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0 solid;
        }

        :root {
            --bg: #ffffff;
            --text: #000000;
            --text-light: #666666;
            --border: #b9b9b9;
            --accent: #000000;
        }

        html {
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: inherit;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: inherit;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            padding: 0;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg);
            padding: 1rem;
            border-bottom: 2px solid var(--text);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .event-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .event-item:active {
            background: #f5f5f5;
        }

        .event-date {
            flex-shrink: 0;
            width: 3rem;
            text-align: center;
        }

        .event-day {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1;
        }

        .event-weekday {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            margin-top: 0.15rem;
        }

        .event-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .event-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .event-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }

        .event-meta-item svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
        }

        .event-description {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .event-arrow {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            color: var(--text-light);
            align-self: center;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
            text-align: center;
            color: var(--text-light);
            min-height: 60vh;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .empty-state h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
            min-height: 60vh;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Hide scrollbar but keep functionality */
        .events-list::-webkit-scrollbar {
            display: none;
        }
        .events-list {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>¡GET OUT!</h1>
        </div>

        <div id="eventsContainer">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        const EVENTS_FILE = './data/events.json';
        
        async function loadEvents() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`${EVENTS_FILE}?t=${timestamp}`, {
                    cache: 'no-store'
                });
                
                if (!response.ok) {
                    throw new Error('Impossible de charger les événements');
                }
                
                const events = await response.json();
                displayEvents(events);
                
            } catch (error) {
                console.error('Erreur:', error);
                showError();
            }
        }

        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            
            if (!events || events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <h2>Aucun événement</h2>
                        <p>Les événements apparaîtront ici</p>
                    </div>
                `;
                return;
            }

            // Trier par date (du plus proche au plus lointain)
            const sortedEvents = [...events].sort((a, b) => {
                return new Date(a.date) - new Date(b.date);
            });

            // Filtrer les événements passés
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const upcomingEvents = sortedEvents.filter(event => {
                const eventDate = new Date(event.date + 'T00:00:00');
                return eventDate >= today;
            });

            if (upcomingEvents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <h2>Aucun événement à venir</h2>
                        <p>Revenez bientôt</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="events-list">';
            
            upcomingEvents.forEach(event => {
                const dateInfo = formatDateInfo(event.date);
                const hasLink = event.link ? true : false;
                
                html += `
                    <div class="event-item" ${hasLink ? `onclick="window.open('${escapeHtml(event.link)}', '_blank')"` : ''}>
                        <div class="event-date">
                            <div class="event-day">${dateInfo.day}</div>
                            <div class="event-weekday">${dateInfo.weekday}</div>
                        </div>
                        <div class="event-content">
                            <div class="event-title">${escapeHtml(event.title || 'Sans titre')}</div>
                            ${(event.heure || event.lieu) ? `
                                <div class="event-meta">
                                    ${event.heure ? `
                                        <span class="event-meta-item">
                                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                            </svg>
                                            ${escapeHtml(event.heure)}
                                        </span>
                                    ` : ''}
                                    ${event.lieu ? `
                                        <span class="event-meta-item">
                                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                            </svg>
                                            ${escapeHtml(event.lieu)}
                                        </span>
                                    ` : ''}
                                </div>
                            ` : ''}
                            ${event.description ? `
                                <div class="event-description">${escapeHtml(event.description)}</div>
                            ` : ''}
                        </div>
                        ${hasLink ? `
                            <svg class="event-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        ` : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function formatDateInfo(dateString) {
            try {
                const date = new Date(dateString + 'T00:00:00');
                return {
                    day: date.getDate().toString().padStart(2, '0'),
                    weekday: date.toLocaleDateString('fr-FR', { weekday: 'short' }).toUpperCase().replace('.', '')
                };
            } catch (error) {
                return { day: '--', weekday: '---' };
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showError() {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <h2>Erreur</h2>
                    <p>Impossible de charger les événements</p>
                </div>
            `;
        }

        loadEvents();
        setInterval(loadEvents, 30000);
    </script>
</body>
</html>
