<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡GET OUT!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            font-weight: bold;
            background: #000;
            color: #000;
            margin: 0;
            padding: 0;
        }
        
        .header {
            background: #000;
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 3px solid #ff0076;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            color: #fff;
        }
        
        .events-list {
            width: 100%;
            padding: 0;
            margin: 0;
        }
        
        .event-item {
            display: block;
            width: 100%;
            padding: 2rem 1.5rem;
            text-decoration: none;
            text-align: center;
            border: none;
        }
        
        .event-date-block {
            margin-bottom: 1rem;
        }
        
        .event-day {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
        }
        
        .event-month-year {
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 0.3rem;
        }
        
        .event-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 1rem 0;
            line-height: 1.2;
        }
        
        .event-meta {
            font-size: 1.1rem;
            margin: 0.8rem 0;
            font-weight: 700;
        }
        
        .event-meta span {
            display: inline-block;
            margin: 0.3rem 0.5rem;
        }
        
        .event-description {
            font-size: 1.3rem;
            line-height: 1.4;
            margin-top: 1rem;
            font-weight: 700;
        }
        
        .loading {
            text-align: center;
            padding: 3rem 1rem;
            color: #fff;
            font-size: 1.2rem;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .event-item {
                padding: 1.5rem 1rem;
            }
            
            .event-day {
                font-size: 2.5rem;
            }
            
            .event-month-year {
                font-size: 1rem;
            }
            
            .event-title {
                font-size: 1.5rem;
            }
            
            .event-meta {
                font-size: 1rem;
            }
            
            .event-description {
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            .header {
                padding: 1rem 0.5rem;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .event-item {
                padding: 1.2rem 0.8rem;
            }
            
            .event-day {
                font-size: 2rem;
            }
            
            .event-month-year {
                font-size: 0.9rem;
            }
            
            .event-title {
                font-size: 1.3rem;
            }
            
            .event-meta {
                font-size: 0.9rem;
            }
            
            .event-meta span {
                margin: 0.2rem 0.3rem;
            }
            
            .event-description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>¡GET OUT!</h1>
    </header>
    
    <div class="events-list" id="eventsList">
        <div class="loading">Chargement des événements...</div>
    </div>
    
    <script>
        const MONTHS = ['JANV.', 'FÉV.', 'MARS', 'AVR.', 'MAI', 'JUIN', 
                        'JUIL.', 'AOÛT', 'SEPT.', 'OCT.', 'NOV.', 'DÉC.'];
        
        const COLORS = [
            '#6f3460', '#4a354f', '#d20076', '#ff0076', '#fa448c', '#fec859',
            '#43b5a0', '#491d88', '#331a38', '#c501e2', '#9a27f7', '#6664ff',
            '#2b97fa', '#01c4e7', '#15e6cc', '#2ef8a0', '#67ff6b', '#c6e602',
            '#e7c500', '#ffa300', '#cf0060', '#ff00ff', '#13a8fe', '#000117'
        ];
        
        // Fonction pour calculer la luminosité d'une couleur
        function getLuminance(hex) {
            // Convertir hex en RGB
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            
            // Formule de luminosité relative (ITU-R BT.709)
            const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
            
            return luminance;
        }
        
        // Fonction pour obtenir la couleur de texte appropriée
        function getTextColor(bgColor) {
            const luminance = getLuminance(bgColor);
            // Si luminance > 0.5, fond clair → texte noir
            // Si luminance <= 0.5, fond foncé → texte blanc
            return luminance > 0.5 ? '#000' : '#fff';
        }
        
        // Fonction pour obtenir une couleur aléatoire
        function getRandomColor() {
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }
        
        async function loadEvents() {
            try {
                const response = await fetch('https://comenottaris.github.io/Sortez/data/events.json', {
                    cache: 'no-store',
                    headers: {'Cache-Control': 'no-cache'}
                });
                
                if (!response.ok) throw new Error('Fichier non trouvé');
                
                const events = await response.json();
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const upcomingEvents = events.filter(event => {
                    const eventDate = new Date(event.date);
                    eventDate.setHours(0, 0, 0, 0);
                    return eventDate >= today;
                });
                
                upcomingEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
                renderEvents(upcomingEvents);
            } catch (error) {
                document.getElementById('eventsList').innerHTML = 
                    '<div class="loading">Aucun événement trouvé</div>';
            }
        }
        
        function renderEvents(events) {
            const container = document.getElementById('eventsList');
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="loading">Aucun événement à venir</div>';
                return;
            }
            
            let html = '';
            events.forEach(event => {
                html += renderEventCard(event);
            });
            container.innerHTML = html;
        }
        
        function renderEventCard(event) {
            const date = new Date(event.date);
            const day = String(date.getDate()).padStart(2, '0');
            const month = MONTHS[date.getMonth()];
            
            const title = event.name || event.title || 'Sans titre';
            const time = event.time || '';
            const type = event.type || '';
            const lieu = event.lieu || '';
            const description = event.description || '';
            const link = event.link || '';
            
            // Générer une couleur aléatoire pour cet événement
            const bgColor = getRandomColor();
            const textColor = getTextColor(bgColor);
            
            const hasLink = link && link.trim() !== '';
            const tag = hasLink ? 'a' : 'div';
            const linkAttr = hasLink ? `href="${esc(link)}" target="_blank" rel="noopener"` : '';
            
            let metaHtml = '';
            if (time) metaHtml += `<span>🕐 ${esc(time)}</span>`;
            if (type) metaHtml += `<span>${esc(type)}</span>`;
            if (lieu) metaHtml += `<span>📍 ${esc(lieu)}</span>`;
            
            let descHtml = '';
            if (description) {
                descHtml = `<div class="event-description">${esc(description)}</div>`;
            }
            
            return `
                <${tag} class="event-item" ${linkAttr} style="background: ${bgColor}; color: ${textColor};">
                    <div class="event-date-block">
                        <div class="event-day">${day}</div>
                        <div class="event-month-year">${month}</div>
                    </div>
                    <div class="event-title">${esc(title)}</div>
                    ${metaHtml ? `<div class="event-meta">${metaHtml}</div>` : ''}
                    ${descHtml}
                </${tag}>
            `;
        }
        
        function esc(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadEvents();
        setInterval(loadEvents, 60000);
    </script>
</body>
</html>
