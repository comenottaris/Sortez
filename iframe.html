<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡GET OUT! - Agenda</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #000000;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --text: #000000;
            --text-light: #666666;
            --border: #e0e0e0;
            --accent: #ff3366;
            --hover-bg: #f5f5f5;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0;
        }

        .header {
            text-align: left;
            padding: 2rem 1.5rem;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 0;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .header .subtitle {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 400;
        }

        .events-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }

        .month-header {
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: sticky;
            top: 100px;
            z-index: 5;
        }

        .event-card {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
            align-items: start;
        }

        .event-card:hover {
            background: var(--hover-bg);
        }

        .event-date-block {
            text-align: center;
            padding: 0.75rem;
            background: var(--bg);
            border: 2px solid var(--primary);
        }

        .event-day {
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
            color: var(--primary);
        }

        .event-weekday {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .event-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .event-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }

        .event-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }

        .event-title a:hover {
            color: var(--accent);
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .event-meta-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .event-meta-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .event-description {
            font-size: 0.95rem;
            color: var(--text-light);
            line-height: 1.6;
            margin-top: 0.5rem;
        }

        .event-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }

        .event-link:hover {
            opacity: 0.7;
        }

        .event-link svg {
            width: 14px;
            height: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 700;
        }

        .empty-state p {
            font-size: 1rem;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-light);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (min-width: 768px) {
            .events-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .event-card {
                border-right: 1px solid var(--border);
            }

            .event-card:nth-child(2n) {
                border-right: none;
            }

            .month-header {
                grid-column: 1 / -1;
            }
        }

        @media (min-width: 1200px) {
            .events-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .event-card:nth-child(2n) {
                border-right: 1px solid var(--border);
            }

            .event-card:nth-child(3n) {
                border-right: none;
            }
        }

        @media (max-width: 640px) {
            .header {
                padding: 1.5rem 1rem;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .event-card {
                grid-template-columns: 80px 1fr;
                gap: 1rem;
                padding: 1rem;
            }

            .event-day {
                font-size: 1.5rem;
            }

            .event-title {
                font-size: 1.1rem;
            }

            .month-header {
                top: 85px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>¡GET OUT!</h1>
            <div class="subtitle">Agenda des événements</div>
        </div>

        <div id="eventsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Chargement des événements...</p>
            </div>
        </div>
    </div>

    <script>
        // Chemin relatif pour le fichier JSON
        const EVENTS_FILE = './data/events.json';
        
        // Charger et afficher les événements
        async function loadEvents() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`${EVENTS_FILE}?t=${timestamp}`, {
                    cache: 'no-store'
                });
                
                if (!response.ok) {
                    throw new Error('Impossible de charger les événements');
                }
                
                const events = await response.json();
                displayEvents(events);
                
            } catch (error) {
                console.error('Erreur:', error);
                showError();
            }
        }

        // Afficher les événements
        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            
            if (!events || events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <h2>Aucun événement</h2>
                        <p>Les événements apparaîtront ici</p>
                    </div>
                `;
                return;
            }

            // Trier par date (du plus proche au plus lointain)
            const sortedEvents = [...events].sort((a, b) => {
                return new Date(a.date) - new Date(b.date);
            });

            // Filtrer les événements passés
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const upcomingEvents = sortedEvents.filter(event => {
                const eventDate = new Date(event.date + 'T00:00:00');
                return eventDate >= today;
            });

            if (upcomingEvents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <h2>Aucun événement à venir</h2>
                        <p>De nouveaux événements seront bientôt ajoutés</p>
                    </div>
                `;
                return;
            }

            // Grouper par mois
            const eventsByMonth = groupByMonth(upcomingEvents);
            
            // Construire le HTML
            let html = '<div class="events-grid">';
            
            for (const [month, monthEvents] of Object.entries(eventsByMonth)) {
                html += `<div class="month-header">${month}</div>`;
                
                monthEvents.forEach(event => {
                    const dateInfo = formatDateInfo(event.date);
                    
                    html += `
                        <div class="event-card">
                            <div class="event-date-block">
                                <div class="event-day">${dateInfo.day}</div>
                                <div class="event-weekday">${dateInfo.weekday}</div>
                            </div>
                            <div class="event-content">
                                <div class="event-title">
                                    ${event.link 
                                        ? `<a href="${escapeHtml(event.link)}" target="_blank" rel="noopener">${escapeHtml(event.title || 'Sans titre')}</a>`
                                        : escapeHtml(event.title || 'Sans titre')
                                    }
                                </div>
                                ${(event.heure || event.lieu) ? `
                                    <div class="event-meta">
                                        ${event.heure ? `
                                            <span class="event-meta-item">
                                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                                </svg>
                                                ${escapeHtml(event.heure)}
                                            </span>
                                        ` : ''}
                                        ${event.lieu ? `
                                            <span class="event-meta-item">
                                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                                </svg>
                                                ${escapeHtml(event.lieu)}
                                            </span>
                                        ` : ''}
                                    </div>
                                ` : ''}
                                ${event.description ? `
                                    <div class="event-description">${escapeHtml(event.description)}</div>
                                ` : ''}
                                ${event.link ? `
                                    <a href="${escapeHtml(event.link)}" class="event-link" target="_blank" rel="noopener">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                        </svg>
                                        Plus d'infos
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            }
            
            html += '</div>';
            container.innerHTML = html;
        }

        // Grouper les événements par mois
        function groupByMonth(events) {
            const groups = {};
            
            events.forEach(event => {
                const date = new Date(event.date + 'T00:00:00');
                const monthKey = date.toLocaleDateString('fr-FR', { 
                    month: 'long', 
                    year: 'numeric' 
                }).toUpperCase();
                
                if (!groups[monthKey]) {
                    groups[monthKey] = [];
                }
                groups[monthKey].push(event);
            });
            
            return groups;
        }

        // Formater les informations de date
        function formatDateInfo(dateString) {
            try {
                const date = new Date(dateString + 'T00:00:00');
                return {
                    day: date.getDate().toString().padStart(2, '0'),
                    weekday: date.toLocaleDateString('fr-FR', { weekday: 'short' }).toUpperCase().replace('.', '')
                };
            } catch (error) {
                return { day: '--', weekday: '---' };
            }
        }

        // Échapper le HTML
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Afficher une erreur
        function showError() {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <h2>Erreur de chargement</h2>
                    <p>Impossible de charger les événements</p>
                </div>
            `;
        }

        // Charger au démarrage
        loadEvents();

        // Rafraîchir toutes les 30 secondes
        setInterval(loadEvents, 30000);
    </script>
</body>
</html>
