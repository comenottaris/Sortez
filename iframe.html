<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡GET OUT!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --color-1: #FF6B6B;
            --color-2: #4ECDC4;
            --color-3: #FFE66D;
            --color-4: #95E1D3;
            --color-5: #F38181;
            --bg: #000000;
            --text: #ffffff;
            --text-muted: #222;
        }
        html {
            font-size: 20px;
        }
        body {
            font-family: 'Arial Black', Arial, sans-serif;
            font-weight: 900;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
            width: 100%;
        }
        .header {
            background: var(--bg);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 3px solid var(--color-1);
            width: 100%;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .events-container {
            margin: 0;
            padding: 2.5rem 0;
            width: 100%;
        }
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 2.2rem;
            width: 100%;
        }
        .event-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 2rem;
            text-decoration: none;
            color: #111;
            background: var(--color-1);
            border-radius: 0;
            margin: 0;
            width: 100%;
            transition: transform 0.12s;
            text-align: center;
        }
        .event-item:nth-child(5n+1) { background: var(--color-1); }
        .event-item:nth-child(5n+2) { background: var(--color-2); }
        .event-item:nth-child(5n+3) { background: var(--color-3); }
        .event-item:nth-child(5n+4) { background: var(--color-4); }
        .event-item:nth-child(5n+5) { background: var(--color-5); }
        .event-item:hover {
            transform: scale(1.005);
            filter: brightness(0.98);
        }
        .event-date-block {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            width: 100%;
        }
        .event-day {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
            color: #111;
        }
        .event-month-year {
            font-size: 1.1rem;
            text-transform: uppercase;
            color: #333;
            letter-spacing: 1px;
            font-weight: 900;
        }
        .event-title {
            font-size: 1.9rem;
            font-weight: 900;
            margin-bottom: 1rem;
            line-height: 1.3;
            color: #111;
            width: 100%;
        }
        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            font-size: 1.1rem;
            color: #222;
            margin-bottom: 1rem;
            justify-content: center;
            font-weight: 700;
        }
        .event-meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .event-type {
            color: #000;
            font-weight: 900;
            text-transform: capitalize;
        }
        .event-description {
            margin-top: 1rem;
            font-size: 1.4rem;
            color: #111;
            line-height: 1.5;
            text-align: center;
            width: 100%;
            font-weight: 900;
        }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #222;
            font-size: 1.4rem;
        }
        @media (max-width: 768px) {
            html { font-size: 18px; }
            .header h1 { font-size: 2.5rem; }
            .header { padding: 1.5rem 0.5rem; }
            .events-container { padding: 1.5rem 0; }
            .event-item { padding: 2rem 1rem; }
            .event-day { font-size: 2.5rem; }
            .event-month-year { font-size: 1rem; }
            .event-title { font-size: 1.6rem; }
            .event-meta { font-size: 1rem; gap: 1rem; }
            .event-description { font-size: 1.2rem; }
        }
        @media (max-width: 480px) {
            html { font-size: 16px; }
            .header h1 { font-size: 2rem; }
            .header { padding: 1rem 0.5rem; }
            .events-container { padding: 1rem 0; }
            .event-item { padding: 1.5rem 0.8rem; }
            .event-day { font-size: 2rem; }
            .event-month-year { font-size: 0.9rem; }
            .event-title { font-size: 1.4rem; }
            .event-meta { font-size: 0.95rem; gap: 0.8rem; }
            .event-description { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>¡GET OUT!</h1>
    </header>
    
    <div class="events-container">
        <div class="events-list" id="eventsList">
            <div class="loading">Chargement des événements...</div>
        </div>
    </div>
    <script>
        const MONTHS_SHORT = ['JANV.', 'FÉV.', 'MARS', 'AVR.', 'MAI', 'JUIN', 
                              'JUIL.', 'AOÛT', 'SEPT.', 'OCT.', 'NOV.', 'DÉC.'];
        async function loadEvents() {
            try {
                const response = await fetch('https://comenottaris.github.io/Sortez/data/events.json', {
                    cache: 'no-store',
                    headers: {'Cache-Control': 'no-cache'}
                });
                
                if (!response.ok) throw new Error('Fichier non trouvé');
                
                const events = await response.json();
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const upcomingEvents = events.filter(event => {
                    const eventDate = new Date(event.date);
                    eventDate.setHours(0, 0, 0, 0);
                    return eventDate >= today;
                });
                upcomingEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
                renderEvents(upcomingEvents);
            } catch (error) {
                document.getElementById('eventsList').innerHTML = 
                    '<div class="loading">Aucun événement trouvé</div>';
            }
        }
        function renderEvents(events) {
            const container = document.getElementById('eventsList');
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="loading">Aucun événement à venir</div>';
                return;
            }
            let html = '';
            events.forEach(event => {
                html += renderEventCard(event);
            });
            container.innerHTML = html;
        }
        function renderEventCard(event) {
            const date = new Date(event.date);
            const day = String(date.getDate()).padStart(2, '0');
            const month = MONTHS_SHORT[date.getMonth()];
            const title = event.name || event.title || 'Sans titre';
            const time = event.time || '';
            const type = event.type || '';
            const lieu = event.lieu || '';
            const description = event.description || '';
            const link = event.link || '';
            const hasLink = link && link.trim() !== '';
            const tag = hasLink ? 'a' : 'div';
            const linkAttr = hasLink
                ? `href="${escapeHtml(link)}" target="_blank" rel="noopener"`
                : '';
            let metaHtml = '';
            if (time) metaHtml += `<span>🕐 ${escapeHtml(time)}</span>`;
            if (type) metaHtml += `<span class="event-type">${escapeHtml(type)}</span>`;
            if (lieu) metaHtml += `<span>📍 ${escapeHtml(lieu)}</span>`;
            let descHtml = '';
            if (description) {
                descHtml = `<div class="event-description">${escapeHtml(description)}</div>`;
            }
            return `
        <${tag} class="event-item" ${linkAttr}>
            <div class="event-date-block">
                <span class="event-day">${day}</span>
                <span class="event-month-year">${month}</span>
            </div>
            <div class="event-title">${escapeHtml(title)}</div>
            ${metaHtml ? `<div class="event-meta">${metaHtml}</div>` : ''}
            ${descHtml}
        </${tag}>
    `;
        }
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        loadEvents();
        setInterval(loadEvents, 60000);
    </script>
</body>
</html>
