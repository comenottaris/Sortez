<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡GET OUT!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-1: #FF6B6B;
            --color-2: #4ECDC4;
            --color-3: #FFE66D;
            --color-4: #95E1D3;
            --color-5: #F38181;
            --bg: #000000;
            --text: #ffffff;
            --text-muted: #aaaaaa;
        }

        html {
            font-size: 18px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .header {
            background: var(--bg);
            padding: 1rem;
            text-align: center;
            border-bottom: 3px solid var(--color-1);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .events-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .events-list {
            display: flex;
            flex-direction: column;
        }

        .event-item {
            display: block;
            padding: 1.2rem 1rem;
            border-bottom: 1px solid #333;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease;
        }

        .event-item:hover {
            background: #1a1a1a;
        }

        .event-item:nth-child(5n+1) { border-left: 5px solid var(--color-1); }
        .event-item:nth-child(5n+2) { border-left: 5px solid var(--color-2); }
        .event-item:nth-child(5n+3) { border-left: 5px solid var(--color-3); }
        .event-item:nth-child(5n+4) { border-left: 5px solid var(--color-4); }
        .event-item:nth-child(5n+5) { border-left: 5px solid var(--color-5); }

        .event-date-block {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .event-day {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .event-month-year {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .event-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .event-description {
            margin-top: 0.5rem;
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .event-link-btn {
            display: inline-block;
            margin-top: 0.6rem;
            padding: 0.4rem 0.8rem;
            background: var(--color-1);
            color: #000;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>¡GET OUT!</h1>
    </header>
    
    <div class="events-container">
        <div class="events-list" id="eventsList">
            <div class="loading">Chargement des événements...</div>
        </div>
    </div>

    <script>
        const MONTHS = ['JAN', 'FÉV', 'MAR', 'AVR', 'MAI', 'JUN', 'JUL', 'AOÛ', 'SEP', 'OCT', 'NOV', 'DÉC'];
        const STORAGE_KEY = 'getout_events';

        function loadEvents() {
            try {
                // Lire depuis localStorage
                const stored = localStorage.getItem(STORAGE_KEY);
                const events = stored ? JSON.parse(stored) : [];
                
                // Filtrer pour n'afficher que les événements à partir d'aujourd'hui
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const upcomingEvents = events.filter(event => {
                    const eventDate = new Date(event.date);
                    eventDate.setHours(0, 0, 0, 0);
                    return eventDate >= today;
                });
                
                renderEvents(upcomingEvents);
            } catch (error) {
                console.error('Erreur chargement événements:', error);
                document.getElementById('eventsList').innerHTML = '<div class="loading">Aucun événement trouvé</div>';
            }
        }

        function renderEvents(events) {
            const container = document.getElementById('eventsList');
            
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="loading">Aucun événement à venir</div>';
                return;
            }

            container.innerHTML = events.map(event => {
                const date = new Date(event.date);
                const day = String(date.getDate()).padStart(2, '0');
                const month = MONTHS[date.getMonth()];
                const year = date.getFullYear();

                const hasLink = event.link && event.link.trim() !== '';
                const tag = hasLink ? 'a' : 'div';
                const linkAttr = hasLink ? `href="${event.link}" target="_blank"` : '';

                let metaHtml = '';
                if (event.time) metaHtml += `<span>🕐 ${event.time}</span>`;
                if (event.lieu) metaHtml += `<span>📍 ${event.lieu}</span>`;

                let descHtml = '';
                if (event.description) descHtml = `<div class="event-description">${event.description}</div>`;

                let linkBtn = '';
                if (hasLink) linkBtn = `<span class="event-link-btn">→ Plus d'infos</span>`;

                return `
                    <${tag} class="event-item" ${linkAttr}>
                        <div class="event-date-block">
                            <span class="event-day">${day}</span>
                            <span class="event-month-year">${month} ${year}</span>
                        </div>
                        <div class="event-title">${event.name}</div>
                        <div class="event-meta">${metaHtml}</div>
                        ${descHtml}
                        ${linkBtn}
                    </${tag}>
                `;
            }).join('');
        }

        // Charger les événements au démarrage
        loadEvents();
        
        // Écouter les changements de localStorage (si l'utilisateur ajoute un événement dans un autre onglet)
        window.addEventListener('storage', loadEvents);
    </script>
</body>
</html>
