name: Add calendar event

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Event payload JSON"
        required: true

jobs:
  add-event:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse payload & update events.json
        run: |
          mkdir -p data
          FILE="data/events.json"

          if [ ! -f "$FILE" ]; then
            echo "[]" > "$FILE"
          fi

          echo '${{ github.event.inputs.payload }}' > new_event.json

          jq '. += [input]' "$FILE" new_event.json > tmp.json
          mv tmp.json "$FILE"

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/events.json
          git commit -m "add event via workflow" || exit 0
          git push
