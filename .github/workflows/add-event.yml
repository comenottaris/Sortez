name: Add calendar event

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Event payload JSON'
        required: true
        type: string

jobs:
  add-event:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Append event to data/events.json
        env:
          PAYLOAD: "${{ github.event.inputs.payload }}"
        run: |
          FILE=data/events.json

          # Créer le fichier temporaire avec le nouvel événement
          echo "$PAYLOAD" > new_event.json

          # Si le fichier existe, ajouter l'événement au tableau
          if [ -f "$FILE" ]; then
            jq '. += [input]' "$FILE" new_event.json > tmp.json
          else
            # Si le fichier n'existe pas, créer un nouveau tableau
            jq '[input]' new_event.json > tmp.json
          fi

          # Remplacer le fichier original
          mv tmp.json "$FILE"

          # Afficher le contenu pour debug
          echo "Contenu de $FILE:"
          cat "$FILE"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Add event via workflow [skip ci]" \
            || echo "No changes to commit"
          git push
